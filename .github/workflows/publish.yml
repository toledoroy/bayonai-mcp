name: Publish MCP package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-mcp
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'toledoroy/bayonai-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: npm install --global npm@11.19.1
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e 'if (require("./packages/bayonai-mcp/package.json").version !== process.env.RELEASE_VERSION) throw new Error("Version mismatch")'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @bayonai/mcp run lint
      - run: pnpm test
      - run: pnpm --filter @bayonai/mcp run build
      - run: pnpm --filter @bayonai/mcp run smoke:pack
      - name: Publish packed artifact with provenance
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm publish "tmp/bayonai-mcp-${RELEASE_VERSION}.tgz" --provenance --access public --ignore-scripts
      - name: Check published artifact integrity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify-registry.mjs
